# 測試用：仿照真實機場的完整 mihomo 設定檔（假資料）
rule-anchor:
  P: &P {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}}
  G1: &G1 {type: select, proxies: [直连, 全部手动, 全部自动, 香港故转]}
  URL: &URL {type: url-test, include-all: true, interval: 300, tolerance: 50}
  SD: &SD {type: select, include-all: true}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
proxy-providers:
  起飛: {<<: *P, url: "https://sub.example.invalid/api?token=FAKE", path: ./proxies/qifei.yaml}
proxies:
  - {name: 直连, type: direct, udp: true}
  - {name: "🇭🇰 香港 01", type: trojan, server: hk.example.invalid, port: 443, password: fake, udp: true}
mixed-port: 7890
authentication:
  - "user:secretpass"
skip-auth-prefixes:
  - 127.0.0.0/8
allow-lan: true
bind-address: "*"
log-level: info
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://example.invalid/ui.zip"
profile:
  store-selected: true
tun:
  enable: true
  stack: system
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://223.5.5.5/dns-query
proxy-groups:
  - {name: 默认代理, <<: *G1}
  - {name: AI, <<: *G1}
  - {name: 全部手动, <<: *SD}
  - {name: 全部自动, <<: *URL}
  - name: 香港故转
    type: fallback
    proxies: [全部自动]
rules:
  - RULE-SET,private_domain,直连
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT
  - DOMAIN-SUFFIX,openai.com,AI
  - MATCH,默认代理
rule-providers:
  private_domain: {<<: *class, url: "https://rules.example.invalid/private.list", path: ./rules/private.list}
